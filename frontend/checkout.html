<!doctype html>
<html>
  <head>
    <title>Razorpay Test Payment</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>

  <body>
    <h2>Revenue Recovery - Test Payment</h2>
    <input type="number" id="amount" placeholder="Enter amount" min="1" />
    <button id="pay-button">Pay ₹Amount</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
      async function createOrder() {
        const amount = document.getElementById("amount").value;
        const response = await fetch("http://127.0.0.1:8000/create-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json", // Crucial for FastAPI to parse Pydantic
          },
          body: JSON.stringify({
            amount: Number(amount),
          }),
        });
        const data = await response.json();
        return data;
      }

      document.getElementById("pay-button").onclick = async function (e) {
        const order = await createOrder();
        const options = {
          key: order.key_id,
          amount: order.amount,
          currency: order.currency,

          name: "Revenue Recovery",
          description: "Test Payment",

          order_id: order.order_id,

          handler: function (response) {
            console.log("Payment successful");
            console.log(response);
          },

          theme: {
            color: "#3399cc",
          },
        };

        const rzp = new Razorpay(options);
        rzp.open();
        e.preventDefault();
      };
    </script>
  </body>
</html>
